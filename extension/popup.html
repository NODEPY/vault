<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vault</title><link rel="stylesheet" href="popup.css"></head>
<body>
<header><div class="brand"><img src="icons/48.png" width="28" height="28" alt=""><strong>Vault</strong></div><span id="status" role="status">Connecting…</span></header>
<main>
<div class="site-context"><span class="eyebrow">CURRENT WEBSITE</span><p id="site">Checking website…</p></div>
<p id="message" role="status" aria-live="polite"></p>
<button id="enable" class="wide" hidden>Enable on this site</button>
<section id="accounts" hidden aria-labelledby="accounts-title"><div class="heading"><h1 id="accounts-title">Saved accounts <span id="account-count"></span></h1><button id="refresh" class="quiet small">Refresh</button></div><div id="entries"></div><button id="capture" class="quiet wide capture">+ Save current login form</button></section>
<section id="pending" hidden aria-labelledby="pending-title"><span class="eyebrow">NEW LOGIN</span><h2 id="pending-title">Save to your vault?</h2><p id="username"></p><div class="row"><button id="save">Save login</button><button id="discard" class="quiet">Discard</button></div></section>
</main>
<footer><svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><span>Stored in desktop Vault.<br>You choose when to fill.</span></footer>
<script type="module" src="popup.js"></script>
</body></html>
